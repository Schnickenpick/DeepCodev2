[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcode"
version = "2.0.0"
description = "Free AI CLI — 34 models, no account, no limits"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
deepcode = "deepcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
